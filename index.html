function useHashRoute() {
  const get = () => window.location.hash.replace(/^#\/?/, '') || 'home';
  const [route, setRoute] = useState(get);
  useEffect(() => {
    const on = () => { setRoute(get()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  return route;
}

function Img({ src, alt, className }) {
  const [err, setErr] = useState(false);
  const fallback = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#dee2e6"/><text x="50%" y="50%" fill="#6c757d" font-family="sans-serif" font-size="22" text-anchor="middle">Foto</text></svg>');
  return <img className={className} src={err ? fallback : src} alt={alt} loading="lazy" onError={() => setErr(true)} />;
}

function Navbar({ route }) {
  const link = (hash, label) => (
    <a href={hash} className={'btn m-1 ' + (route === hash.slice(2) || (hash === '#/' && route === 'home') ? 'btn-light' : 'btn-outline-light')}>{label}</a>
  );
  return (
    <nav className="navbar navbar-dark navbar-expand-lg py-2">
      <div className="container">
        <a className="navbar-brand" href="#/"><img src="./assets/web-logo3.png" alt="Logo" /></a>
        <button className="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span className="navbar-toggler-icon" /></button>
        <div className="collapse navbar-collapse" id="nav">
          <div className="ms-auto d-flex flex-column flex-lg-row">
            {link('#/', 'Beranda')}
            {link('#/profil', 'Profil Dosen')}
            <a className="btn btn-primary m-1" href={FORM_URL} target="_blank" rel="noreferrer">Pengajuan Dosen Pembimbing</a>
          </div>
        </div>
      </div>
    </nav>
  );
}

function Home() {
  return (
    <div className="page hero">
      <h2 className="fw-bold mb-4">Selamat Datang!</h2>
      <div className="row g-4 align-items-center">
        <div className="col-lg-7">
          <p className="justify">
            Bernaung di Jurusan Teknologi Pertanian - Politeknik Negeri Pontianak; program Studi Diploma 4 (D-IV) <b>Pengolahan Hasil Perkebunan Terpadu (PHPT)</b> merupakan hasil dari alih program. Sebelumnya, program studi ini adalah D-III Teknologi Pengolahan Hasil Pertanian (TPHP), yang mulai beroperasi sejak tahun 1999, sesuai dengan Surat Keputusan Direktur Jenderal Pendidikan Tinggi, Departemen Pendidikan Nasional Republik Indonesia nomor 412/DIKTI/Kep/1999. Saat ini, status akreditasi program studi D4 PHPT adalah terakreditasi dengan peringkat "B," berdasarkan Surat Keputusan Badan Akreditasi Nasional Perguruan Tinggi, Departemen Pendidikan dan Kebudayaan Republik Indonesia Nomor 6320/SK/BAN-PT/Ak-PNB/STr/ix/2022. Program Studi D-IV PHPT menghasilkan lulusan dengan gelar Sarjana Terapan Pertanian (S.Tr.P.) dengan kompetensi di bidang laboratorium dan rekayasa proses pengolahan hasil perkebunan.
          </p>
        </div>
        <div className="col-lg-5"><Img src="./assets/jurusan-tp.png" alt="Gedung Jurusan TP" /></div>
      </div>
    </div>
  );
}

function ProfileList() {
  const [q, setQ] = useState('');
  const [page, setPage] = useState(1);
  const filtered = useMemo(() => profiles.filter(p => searchable(p).includes(q.toLowerCase())), [q]);
  const pages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
  const current = filtered.slice((page - 1) * ITEMS_PER_PAGE, page * ITEMS_PER_PAGE);
  const go = n => { setPage(n); window.scrollTo(0, 0); };

  return (
    <div className="page">
      <div className="row align-items-center mb-3 g-2">
        <div className="col-md-4"><h2 className="fw-bold m-0">Profil Dosen</h2></div>
        <div className="col-md-8">
          <input className="form-control form-control-lg" placeholder="Cari berdasarkan nama/minat/publikasi!"
            value={q} onChange={e => { setQ(e.target.value); setPage(1); }} />
        </div>
      </div>
      <p className="text-muted small">{filtered.length} dosen ditemukan</p>
      <div className="row g-4">
        {current.map(p => (
          <div className="col-12 col-sm-6 col-lg-4" key={p.id}>
            <a href={'#/' + p.id} className="text-decoration-none text-dark">
              <div className="card card-dosen shadow-sm text-center p-4">
                <div><Img className="avatar" src={p.img} alt={p.title} /></div>
                <hr />
                <h6 className="fw-bold mb-1">{p.title}</h6>
                <span className="text-muted small">{p.subtitle}</span>
              </div>
            </a>
          </div>
        ))}
        {current.length === 0 && <p className="text-center text-muted py-5">Tidak ada hasil yang cocok.</p>}
      </div>
      {pages > 1 && (
        <ul className="pagination justify-content-center mt-4">
          <li className={'page-item ' + (page === 1 ? 'disabled' : '')}><button className="page-link" onClick={() => go(page - 1)}>&laquo;</button></li>
          {[...Array(pages)].map((_, i) => (
            <li key={i} className={'page-item ' + (page === i + 1 ? 'active' : '')}><button className="page-link" onClick={() => go(i + 1)}>{i + 1}</button></li>
          ))}
          <li className={'page-item ' + (page === pages ? 'disabled' : '')}><button className="page-link" onClick={() => go(page + 1)}>&raquo;</button></li>
        </ul>
      )}
    </div>
  );
}

function Section({ title, items }) {
  if (!items || items.length === 0) return null;
  return (
    <div className="mb-4">
      <h6 className="fw-bold border-bottom pb-2">{title}</h6>
      <ul className="pub-list ps-3">{items.map((t, i) => <li key={i}>{t}</li>)}</ul>
    </div>
  );
}

function ProfileDetail({ id }) {
  const p = profiles.find(x => x.id === id);
  if (!p) return <div className="page text-center py-5"><p>Profil tidak ditemukan.</p><a href="#/profil" className="btn btn-dark">Kembali</a></div>;
  return (
    <div className="page">
      <a href="#/profil" className="btn btn-outline-dark mb-3">&larr; Kembali ke daftar</a>
      <div className="card border-0 shadow-sm rounded-4 p-4">
        <h3 className="fw-bold text-center mb-4">{p.title}</h3>
        <div className="row g-4">
          <div className="col-md-3 text-center"><Img className="detail-img" src={p.img} alt={p.title} /></div>
          <div className="col-md-9">
            <p className="mb-1"><b>NIP:</b> {p.nip}</p>
            {p.email !== '-' && <p className="mb-1"><b>E-mail:</b> <a href={'mailto:' + p.email}>{p.email}</a></p>}
            <p className="mb-4"><b>Bidang Keahlian:</b> {p.subtitle}</p>
            <Section title="Minat Penelitian" items={p.minat} />
            <Section title="Riwayat Publikasi" items={p.riwayat} />
            <Section title="Penelitian Belum Dipublikasikan" items={p.unpublished} />
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const route = useHashRoute();
  let view;
  if (route === 'home') view = <Home />;
  else if (route === 'profil') view = <ProfileList />;
  else view = <ProfileDetail id={route} />;
  return (
    <>
      <Navbar route={route} />
      <main className="container my-4 flex-grow-1">{view}</main>
      <footer className="p-4 text-center small">
        © 2024 D-IV Pengolahan Hasil Perkebunan Terpadu (PHPT) Politeknik Negeri Pontianak. All rights reserved.
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
